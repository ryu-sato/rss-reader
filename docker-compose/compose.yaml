services:
  app:
    image: ghcr.io/ryu-sato/rss-reader
    ports:
      - "3000:3000"
    volumes:
      - db-data:/app/data
    environment:
      DATABASE_URL: "file:/app/data/db.sqlite"
    env_file:
      - .env.app.secret
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db-data: